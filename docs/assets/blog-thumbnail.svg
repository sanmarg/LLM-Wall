<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"/>

    <!-- Grid pattern -->
    <g opacity="0.05">
        <line x1="0" y1="100" x2="1200" y2="100" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="0" y1="200" x2="1200" y2="200" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="0" y1="300" x2="1200" y2="300" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="0" y1="400" x2="1200" y2="400" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="0" y1="500" x2="1200" y2="500" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="200" y1="0" x2="200" y2="630" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="400" y1="0" x2="400" y2="630" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="600" y1="0" x2="600" y2="630" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="800" y1="0" x2="800" y2="630" stroke="#6366f1" stroke-width="0.5"/>
        <line x1="1000" y1="0" x2="1000" y2="630" stroke="#6366f1" stroke-width="0.5"/>
    </g>

    <!-- Gradient blobs -->
    <circle cx="150" cy="150" r="200" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
    <circle cx="1050" cy="480" r="250" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>

    <!-- Shield icon -->
    <g transform="translate(80, 130)">
        <path d="M60 10 L110 35 L110 95 C110 130 85 155 60 165 C35 155 10 130 10 95 L10 35 Z" 
              fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#shadow)"/>
        <text x="60" y="105" font-size="50" text-anchor="middle" fill="url(#accent)">🧱</text>
    </g>

    <!-- Title -->
    <text x="240" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">
        Building a Zero-Trust
    </text>
    <text x="240" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#accent)">
        LLM Security Proxy
    </text>
    <text x="240" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" font-weight="400">
        with Coral SQL at its investigative core
    </text>

    <!-- Coral badge -->
    <rect x="240" y="290" width="160" height="36" rx="18" fill="url(#coral)" opacity="0.9"/>
    <text x="320" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">
        🐚 Powered by Coral
    </text>

    <!-- Code block -->
    <rect x="80" y="360" width="500" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="392" font-family="'Monaco', 'Menlo', monospace" font-size="14" fill="#a78bfa">coral sql &quot;SELECT * FROM github.issues&quot;</text>
    <text x="100" y="416" font-family="'Monaco', 'Menlo', monospace" font-size="14" fill="#34d399">┌──────────┬──────────────────────────────┐</text>
    <text x="100" y="440" font-family="'Monaco', 'Menlo', monospace" font-size="14" fill="#e2e8f0">│ id       │ title                        │</text>
    <text x="100" y="464" font-family="'Monaco', 'Menlo', monospace" font-size="14" fill="#e2e8f0">│──────────┼──────────────────────────────│</text>
    <text x="100" y="488" font-family="'Monaco', 'Menlo', monospace" font-size="14" fill="#fbbf24">│ 42       │ Credential leak in prompt log │</text>

    <!-- Feature pills on right -->
    <rect x="650" y="360" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="660" y="388" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">🔍 IncidentInvestigator</text>

    <rect x="650" y="416" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="660" y="444" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">🧬 PatternHunter</text>

    <rect x="650" y="472" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="660" y="500" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">🍯 Honeypot Generator</text>

    <rect x="880" y="360" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="890" y="388" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">⚙️ Policy Generator</text>

    <rect x="880" y="416" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="890" y="444" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">🧩 MCP Tools (3)</text>

    <rect x="880" y="472" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="890" y="500" font-size="16" fill="#e2e8f0" font-family="system-ui, sans-serif">📋 Blockchain Ledger</text>

    <!-- Bottom bar -->
    <rect x="0" y="570" width="1200" height="60" fill="#1e293b" opacity="0.5"/>
    <text x="80" y="605" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">github.com/sanmarg/LLM-Wall</text>
    <text x="550" y="605" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">✦ 63/63 E2E tests passing</text>
    <text x="800" y="605" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">✦ Coral Bean Hackathon 2026</text>

    <!-- Gradient line accent -->
    <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
</svg>
